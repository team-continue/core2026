# ============================================================================
# フライングディスクの曲射弾道 実測テーブル（左砲塔）
#
# 測り方:
#   砲身を的の中心へまっすぐ向けて（照準補正なしで）発射し、
#   実際の着弾点が中心からどれだけずれたかを記録する。
#   水平距離 500mm ごとに 0.5m〜6.0m を計測する。
#
# 各エントリ:
#   <水平距離[m]>: {y: <横ずれ[m]>, z: <縦ずれ[m]>}
#
#   y: 左方向が正（右へ逸れたら負）
#   z: 上方向が正（落下したら負）
#   いずれも砲塔座標系（REP-103: x前方 / y左 / z上）に合わせた符号。
#
# aim_bot はこのずれを打ち消す向きに射角を補正する:
#   yaw 補正   = atan2(-y, 距離)
#   pitch 補正 = atan2(-z, 距離)
#
# 中間距離は距離で線形補間する。
# テーブルが覆っていない距離では補正せず、的の方向へそのまま砲塔を向ける。
#
# 現在は実測前のため全て 0（= 直線弾道）。計測後にこの値を差し替えること。
# 自動発射を許可する上限距離は shooter.params.yaml の
# point3d.ballistic.max_shoot_range_m（既定 5.0m）で別途指定する。
# テーブルが 6.0m まであるのは、5m を超えた目標にも照準だけは追従させるため。
# ============================================================================

ballistics:
  0.5: {y: 0.0, z: 0.0}
  1.0: {y: 0.0, z: 0.0}
  1.5: {y: 0.0, z: 0.0}
  2.0: {y: 0.0, z: 0.0}
  2.5: {y: 0.0, z: 0.0}
  3.0: {y: 0.0, z: 0.0}
  3.5: {y: 0.0, z: 0.0}
  4.0: {y: 0.0, z: 0.0}
  4.5: {y: 0.0, z: 0.0}
  5.0: {y: 0.0, z: 0.0}
  5.5: {y: 0.0, z: 0.0}
  6.0: {y: 0.0, z: 0.0}
