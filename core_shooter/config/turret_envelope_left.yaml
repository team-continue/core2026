# ============================================================================
# 左砲塔の可動包絡線
#
# ヨー角ごとに許されるピッチ範囲を書く。点と点の間は線形補間する。
# 値はすべて実際のモータ角 [rad]（符号反転などの読み替えは不要）。
#
#   <ヨー角>: {pitch_min: <下限>, pitch_max: <上限>}
#
# 制限が切り替わる箇所は、段差にせず少し傾斜させること。
#
#   pitch
#    3.14 │                      ┌────────────────┐
#         │                     ╱│  ピッチ自由     │
#    1.00 ├────────────────────┘ │                │
#         │  ここから上げられない  │                │
#   -2.00 ├──────────────────────────────────────┤
#         └──┬─────────────────┬─┬──────────────┬──→ yaw
#         -2.20              -0.20 -0.15       0.58
#
# 旧 zone.* 設定からの移行:
#   左砲塔は zone.yaw_reversed: true だったため、設定値の符号が
#   実際のモータ角と逆だった（yaw_zone3_end: 2.2 は実際には yaw=-2.2）。
#   包絡線では実角度をそのまま書くので読み替えは不要。
#
#   旧 ZoneCD (zone_yaw 0.15〜2.20 = 実 yaw -2.20〜-0.15): 上限 1.0
#   旧 ZoneAB/ZoneBC (実 yaw -0.15〜0.58): 上限 3.14 で実質無制限
# ============================================================================

envelope:
  -2.20: {pitch_min: -2.0, pitch_max: 1.0}
  -0.20: {pitch_min: -2.0, pitch_max: 1.0}
  -0.15: {pitch_min: -2.0, pitch_max: 3.14}
  0.58: {pitch_min: -2.0, pitch_max: 3.14}
