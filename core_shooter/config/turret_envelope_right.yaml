# ============================================================================
# 右砲塔の可動包絡線
#
# ヨー角ごとに許されるピッチ範囲を書く。点と点の間は線形補間する。
# 値はすべて実際のモータ角 [rad]（符号反転などの読み替えは不要）。
#
#   <ヨー角>: {pitch_min: <下限>, pitch_max: <上限>}
#
# aim_bot はこの包絡線を順引き（ヨー→ピッチ範囲）と
# 逆引き（ピッチ→ヨー範囲）の両方に使う。逆引きによって
# 「今のピッチでは入れない領域へヨーが進む」ことを防ぐため、
# ピッチが下がるにつれて進めるヨーが広がる。
#
# 制限が切り替わる箇所は、段差にせず少し傾斜させること。
# 不連続だと境界で指令がばたつく。傾斜させておけば起きない。
#
#   pitch
#    3.14 ├────────────────────┐
#         │    ピッチ自由       │╲
#    0.00 │                    │ └──────────────────┤
#         │                      ここから上げられない │
#   -1.80 ├──────────────────────────────────────────┤
#         └────┬──────────────┬─┬──────────────────┬──→ yaw
#           -0.48           0.25 0.30            2.20
#
# 旧 zone.* 設定からの移行:
#   ZoneAB/ZoneBC (yaw -0.48〜0.25) は上限 3.14 で実質無制限だった
#   ZoneCD (yaw 0.25〜2.20) だけ上限 0.0 に制限されていた
#   実質的な制約は「ヨー 0.25 を超えたら水平より上げない」の1本だけ
# ============================================================================

envelope:
  -0.48: {pitch_min: -1.8, pitch_max: 3.14}
  0.25: {pitch_min: -1.8, pitch_max: 3.14}
  0.30: {pitch_min: -1.8, pitch_max: 0.0}
  2.20: {pitch_min: -1.8, pitch_max: 0.0}
