site_name: core2026 ドキュメント
site_description: CoRE2026 ロボット ROS2 プロジェクトドキュメント
repo_url: https://github.com/team-continue/core2026
repo_name: core2026

theme:
  name: material
  language: ja
  logo: assets/continue_logo.png
  favicon: assets/continue_logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切替
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切替
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: ja
      separator: '[\s\-、。，！？\(\)\[\]「」『』【】]'
  - mermaid2

nav:
  - ホーム: index.md
  - はじめに:
    - クイックスタート: getting-started/quick-start.md
    - Docker環境: getting-started/docker.md
    - Unityシミュレータ: getting-started/unity-sim.md
  - アーキテクチャ:
    - システム概要: architecture/overview.md
    - TFフレームと座標系: architecture/tf-tree.md
    - トピック・メッセージ一覧: architecture/topics.md
  - メカ:
    - mechanics/index.md
    - 駆動系・旋回機構: mechanics/drivetrain.md
    - 砲塔・装填・発射機構: mechanics/turret.md
  - 回路:
    - circuit/index.md
    - 基板とピン配置: circuit/boards.md
    - CANバスとモータID: circuit/buses.md
  - ソフトウェア:
    - Launch:
      - core_launch:
        - packages/core_launch/index.md
        - odom_bridge_node: packages/core_launch/odom_bridge_node.md
        - map_server_node: packages/core_launch/map_server_node.md
    - Sensing:
