/**:
  ros__parameters:
    publish_period_ms: 1000 # /diagnostics を出す周期[ms]

    # トピックの途絶監視。名前ごとに topic / type / timeout_ms / level("warn" | "error") を指定する
    # 重いトピック(画像・点群)は避け、同じ機器から出る軽いトピックで代用する
    topic_checks:
      - microcontroller
      - imu
      - livox
      - camera_tps
      - camera_left
      - camera_right
      - localization

    microcontroller: # モータ単位の状態はファーム対応待ち。暫定で joint_states 全体の途絶を見る
      topic: /hardware/joint_states
      type: sensor_msgs/msg/JointState
      timeout_ms: 300
      level: error
    imu:
      topic: /imu
      type: sensor_msgs/msg/Imu
      timeout_ms: 200
      level: error
    livox: # 点群は重いため LiDAR 内蔵 IMU で機器の生存を見る
      topic: /livox/imu
      type: sensor_msgs/msg/Imu
      timeout_ms: 500
      level: warn
    camera_tps:
      topic: /turret_camera_tps/color/camera_info
      type: sensor_msgs/msg/CameraInfo
      timeout_ms: 1000
      level: warn
    camera_left:
      topic: /turret_camera_left/color/camera_info
      type: sensor_msgs/msg/CameraInfo
      timeout_ms: 1000
      level: warn
    camera_right:
      topic: /turret_camera_right/color/camera_info
      type: sensor_msgs/msg/CameraInfo
      timeout_ms: 1000
      level: warn
    localization:
      topic: /localization/odom
      type: nav_msgs/msg/Odometry
      timeout_ms: 1000
      level: warn

    # バッテリー(メッセージ未実装のため、データが来るまでは STALE)
    battery:
      enabled: true
      topic: /hardware/battery
      timeout_ms: 2000
      warn_voltage: 22.2 # [V] 仮値。バッテリー仕様に合わせて調整する
      error_voltage: 21.0 # [V] 仮値
