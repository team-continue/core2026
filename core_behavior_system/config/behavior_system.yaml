waypoint_selector:
  ros__parameters:
    update_rate_hz: 20
    mode: "navigate"
    risk_threshold: 0.75
    w_distance: 1.0
    w_angle: 3.0
    w_time: 20.0
    revisit_cooldown: 15.0
    use_exponential_decay: true
    forward_only: false
    random_jitter: 0.01
    weights: [1.0, 0.5, 2.0]
    current_x: 0.0
    current_y: 0.0
    current_yaw: 0.0
    odom_topic: "/odom"
    goal_pose_topic: "/waypoint_selector/goal_pose"
    pause_topic: "/waypoint_selector/pause"
    arrival_radius: 0.5
    # Flat list: [x1, y1, x2, y2, ...]
    waypoints: [
       3.0,  0.0,
       3.0, -4.0,
       8.0, -4.0,
       9.0,  0.0,
       7.0,  3.0,
       4.0,  6.0,
      -3.0,  0.0,
      -3.0,  4.0,
      -8.0,  4.0,
      -9.0,  0.0,
      -7.0, -3.0,
      -4.0, -6.0,
    ]

behavior_system:
  ros__parameters:
    manual_mode_topic: "/manual_mode"
    auto_point_select_topic: "/auto_point_select"
    selected_pose_topic: "/selected_pose"
    enemy_detected_topic: "/enemy_detected"
    goal_reached_topic: "/goal_reached"
    waypoint_goal_topic: "/waypoint_selector/goal_pose"
    goal_pose_topic: "/goal_pose"
    rotation_topic: "/rotation"
    state_topic: "/behavior_system/state"
    state_name_topic: "/behavior_system/state_name"
    pause_topic: "/waypoint_selector/pause"
    odom_topic: "/odom"
    publish_rate_hz: 10.0
    pose_equal_eps: 0.001

enemy_detection_coordinator:
  ros__parameters:
    left_target_topic: "/left/damage_panel_pose"
    right_target_topic: "/right/damage_panel_pose"
    enemy_detected_topic: "/enemy_detected"
    stale_timeout_sec: 0.5
    detected_z_threshold: 0.5

attack_shoot_manager:
  ros__parameters:
    state_topic: "/behavior_system/state"
    left_target_topic: "/left/target_pose"
    right_target_topic: "/right/damage_panel_pose"
    left_shoot_once_topic: "/left_shoot_once"
    right_shoot_once_topic: "/right_shoot_once"
    image_width: 640.0
    image_height: 480.0
    image_center_x: 0.5
    image_center_y: 0.5
    center_tolerance_x_px: 300.0
    center_tolerance_y_px: 300.0
    detected_z_threshold: 0.5
    stale_timeout_sec: 0.2
    shoot_cooldown_sec: 0.5
    attack_state_value: 1
    publish_rate_hz: 20.0
