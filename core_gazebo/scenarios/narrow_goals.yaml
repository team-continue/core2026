# field_narrow.sdf の壁（x = -2〜2）の通路を通って、左右のゴールを行き来する。
# 通路の幅と片側の余裕: y = -2.0 が 1.25m（0.225m）、y = 1.5 が 1.6m（0.4m）、y = 5.0 が 2.0m（0.6m）。
# どれも narrow_passage.min_side_clearance_m（0.2m）以上なので、入って通り抜ける。
# 幅 1.1m（片側 0.15m、y = -5.0）の通路は narrow_blocked シナリオで試す
start: [-8.0, -2.0, 0.0]
goals:
  - [8.0, -2.0, 0.0]
  - [-8.0, 1.5, 0.0]
  - [8.0, 5.0, 0.0]
  - [-8.0, -2.0, 0.0]
timeout_s: 240
repeat: 1
world: field_narrow.sdf
obstacles: []
