# 合流で相手が先に入る。線の置き方は merge_own_first.yaml と同じで、位相だけを変えた。
# 相手は約 13.2 秒に交点 (0, 0) を通り、自機（譲らなければ約 13.8 秒）より約 0.6 秒先。
# 自機は譲って相手の後ろを通る。実際の順番は記録から確かめる
start: [-10.0, 0.0, 0.0]
goals:
  - [10.0, 0.0, 0.0]
timeout_s: 60
repeat: 1
obstacles:
  - {name: robot_merge, type: robot, start: [-3.5, -6.06], end: [2.5, 4.33], peak_speed: 2.5, phase: 0.4013}
