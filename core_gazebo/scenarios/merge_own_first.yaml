# 合流で自機が先に入る。自機は y=0 を +x へ進み、相手は右下から 60° の線で交点 (0, 0) を通る
# （進む向きの差が 90° 未満で、合流の規則の対象）。相手は交点の手前では自機の右前にいる。
# Gazebo で自機が交点を通るのはシミュレーション時刻で約 13.8 秒（2 本同時の試行で 13.4 秒と 14.2 秒。
# 起動の負荷で前後する）。相手が約 14.7 秒に通るよう位相を決めた（自機が約 0.9 秒先で、
# lead_time_s 0.5 秒を超える）。実際の順番は記録から確かめる
start: [-10.0, 0.0, 0.0]
goals:
  - [10.0, 0.0, 0.0]
timeout_s: 60
repeat: 1
obstacles:
  - {name: robot_merge, type: robot, start: [-3.5, -6.06], end: [2.5, 4.33], peak_speed: 2.5, phase: 0.3018}
