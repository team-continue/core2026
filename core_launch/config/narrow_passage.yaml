# 狭い通路。大域計画（global_planner）と局所計画（mppi_lite）が同じ値を読む。
# 通路の片側の余裕は、機体を通路の真ん中に置いたときの、機体の側面から静止物までの距離（通路の幅から機体の幅
# 0.8m を引いた半分）。min_side_clearance_m 以上なら入り、未満なら元の動きのまま入口の手前で止まる
# （0.2m なら、幅 1.2m 以上の通路に入る）。
# - 大域計画: 静止物を膨らませる半径を、機体の外接円の半径 + footprint.margin_m（0.67m）から、機体の半幅 +
#   min_side_clearance_m（0.6m）にする（小さいほう）。幅 1.2m 以上の通路を通る経路を作る。距離の場はセルの
#   中心どうしの距離なので、格子（planner.resolution_m 0.1m）の丸めで幅 1.1m ほどの通路にも経路ができることがある。
#   しきい値は局所計画が守り、そのような通路では入口の手前で止まる
# - 局所計画: 経路に直角に左右の静止物を探し（地図の点は 0.2m おきなので、光線の左右 0.1m の幅で探す）、
#   両側が閉じている所を通路とする。余裕は地図の点のセルの中心までで測る（誤差は半セル 0.025m 以内）。
#   入れる通路の中（入口の手前で機体の角が入口の壁の端に近づく範囲を含む）では、
#   ・静止物の余裕（footprint.margin_m + 速さ × mppi.static_margin_time_s）の速さを、経路に直角な速さにする
#     （壁に沿って走っても余裕を増やさない。両側を壁に挟まれた所だけで使う）
#   ・機体の点の距離が「通路の余裕 − lateral_tolerance_m」以上なら静止物の罰をかけない（距離の場は 0.05m の
#     格子の中心どうしなので、真ん中にいても 1 セルほど短く読める）。片寄ると罰がかかり、真ん中を通る
#   ・参照軌道の速さを「通路の余裕 − footprint.margin_m − lateral_tolerance_m」を mppi.static_margin_time_s で
#     進む速さまでに下げる（片側 0.2m で 0.5m/s、0.225m で 0.75m/s、0.3m で 1.5m/s、0.45m 以上で上限の 3m/s）
#   単体試験（指令どおりに動く機体）では、幅 1.25m を 0.75m/s、1.4m を約 1.5m/s で真ん中を通り、幅 1.1m は
#   入口の手前で止まる
# enabled: false で元の動き（外接円の半径で膨らませ、罰も速さも変えない。幅 2.0m 以下の長い通路は入口の
# 手前で止まる）
/**:
  ros__parameters:
    narrow_passage:
      enabled: true
      min_side_clearance_m: 0.2
      # 罰をかけない真ん中からのずれ（格子の丸めの分を含む）。速さの上限もこの分を残す。速さの分を余裕に
      # 足していた試作では、真ん中から 4cm ずれただけで格子の丸めと合わせて余裕の境に届き、入口の手前で
      # 止まった（Gazebo）
      lateral_tolerance_m: 0.05
