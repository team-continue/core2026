# 計画とは独立した安全停止。無効にして動くときは警告を出し続ける。
/**:
  ros__parameters:
    safety_stop:
      enabled: true
      ttc_slow_s: 1.5
      # 指令どおりに進むとこの時間より早く当たるなら止める。「止まるほうが早く当たるなら、指令は避ける
      # 動きなので通す」のは、指令がこの時間までに当たらないときだけにする（記録の自機が原因の接触 9 件の
      # うち 5 件で、0.25〜0.70 秒で当たる指令をこの理由で通していた）
      ttc_stop_s: 0.6
      footprint_margin_m: 0.1
      max_decel_mps2: 3.0
      # 相手の到達範囲（方向別の受動安全）。相手を、追跡の位置と速度の予測に、推定の遅れ（追跡の時刻から
      # 今まで）、速度の不確かさ（追跡の velocity_sigma）、加速度の上限の分を足して広げた円として扱う。
      # 指令を commit_time_s 保ったあと max_decel で止まる軌道か、指令を保ち続ける軌道のどちらかで、
      # 相手の方向へ動いたまま範囲に入らなければ通す。入るなら、範囲に入らない候補の速度のうち指令に
      # 最も近いものに替え、どれも入るなら範囲から離れる距離が最大のものにする。
      # 止まっている間と、相手から離れる・横へ動く間は範囲に入っても数えない。止まった機体は動き出さない
      # （候補の速さは指令と今の速さの大きいほうまで）ので、ゴールで止まっている間に来るロボットは避けない
      reachable:
        enabled: true
        # 相手の加速度の上限。記録の自機が原因の接触で、端で折り返して戻ってくる相手は +0.7〜+1.2m/s² で
        # 加速していた。止まっているロボットと人にも足す（動き出せるため）。遅い不明の物体には足さない。
        # 局所計画（mppi_lite）も同じ値を読み、合流で相手が交点に着く時刻と、ゴールの手前で待つ判定に使う
        obstacle_accel_mps2: 1.5
        # 追跡の速度の不確かさ（落ち着いた値を超える分）に掛ける倍率。確定の直後は 1.5m/s ほどになる
        velocity_sigma_gain: 1.0
        # 止まり始めるまでに指令を保つ時間。この周期 0.05 秒と、指令から機体が動くまでの約 0.1 秒
        commit_time_s: 0.15
        # 候補の速度を保ち続けて確かめる時間。横へ避け続ける、離れ続ける候補を使えるようにする。
        # 長くすると範囲（3 秒で 6.8m）が広がりすぎて、保ち続ける候補がほとんど使えなくなる
        escape_horizon_s: 1.0
        # 候補の速度は、今の速度から max_decel × 0.5 秒（1.5m/s）まで、16 方向に変えたもの
        escape_change_s: 0.5
        directions: 16
      # 静止物（地図と柵）の判定。相手の到達範囲のために指令を候補の速度に替えるときだけ、候補ごとに
      # reachable.commit_time_s 保ってから max_decel で止まる軌道を進め（0.05 秒ごとの点の間も格子の半分ごとに
      # 調べる）、機体の 4 隅と中心の静止物までの最小距離を求める。最小距離が min(margin_m, 今の距離 −
      # tolerance_m) 以上で、静止物のセルに入らない（0 より大きい）なら静止物について使える（今すでに余裕より
      # 近い狭い所でも、壁と平行・離れる向きの候補は残す）。選び方は、範囲に入らず静止物も使える
      # 候補のうち指令に最も近いもの、なければ静止物が使える候補のうち範囲から最も離れるもの、それもなければ
      # 静止物から最も離れるもの。指令をそのまま通すとき（MPPI の指令）は見ない。計画が静止物を見ていて、
      # 狭い所で今より減速を増やさないため。
      # 距離の場は mppi_lite と同じ地図（map_path）と field の範囲から同じ関数で作り、map→odom は TF の最新を
      # 使う。地図か TF がなければ判定せず、間引いた警告を出す。enabled: false で元の動き。
      # 第2段の後の obstacle_goals で、候補が静止物を見ずに 1〜2m/s で箱へ寄り、静止物までの最小距離が
      # 0.02〜0.38m に下がった（第1段の後は 0.40m 以上）
      static:
        enabled: true
        # 機体と静止物の間に保つ余裕。footprint.margin_m と同じ
        margin_m: 0.1
        # 今の距離から近づくのを許す距離。距離の場はセルごとに一定なので、壁と平行に動いても点の入るセルが
        # 変わると距離が 1 段（壁が軸に沿えば 0.05m、斜めの壁で約 0.035m）変わる。格子 1 段分を許す。
        # 格子を変えるときは合わせる
        tolerance_m: 0.05
        # 距離の場の格子。mppi.yaml の grid_resolution_m と同じにする（起動時だけ読む）
        grid_resolution_m: 0.05
      # 正面から来るロボット（動いているとみなせる 0.3m/s 以上のロボットで、自機の速度と進む向きが 150° 以上
      # 違い、自機の前方で進む線から自機の半幅と余裕と相手の大きさ以内）だけが原因で指令を替えるとき、
      # 候補を今の向きのまま減速するもの（今の速度の 0.75、0.5、0.25、0 倍）に限り、横へ逃がさない（道を
      # 開けない。2026-11-14 のユーザーの判断。局所計画は mppi.yaml の oncoming_rule で停止線に止まる）。
      # 範囲に入らない候補のうち指令に最も近いもの、なければ止まる。false で元の動き
      oncoming:
        brake_only: true
      # 高速で当てられそうなときの衝撃の緩和（2026-11-14 のユーザーの判断）。止まっているか遅い（0.5m/s 未満の）
      # ときに、動いているとみなせる相手（mppi.yaml の track_motion）が、今の速度のままだと horizon_s 以内に機体と
      # 重なり（余裕なし）、そのときの近づく速さ（中心を結ぶ向きの相対速度）が min_impact_speed_mps 以上なら、
      # 相手から離れる向き（相手の方向から約 107° 以上）のうち、当たるときの近づく速さが最も小さくなるもの
      # （directions 方向 × max_speed_mps の 1 倍と 0.5 倍）へ、緩和を始めた位置から max_shift_m まで動いて止まる。
      # 動く先で静止物の余裕（static）が取れ、ほかの相手の到達範囲へ向かわず、当たるときに自機が相手の方向へ
      # 動いていない候補だけを使い、何もしないときより min_reduction_mps 以上小さくならなければ動かない。
      # 止まっている機体でも動かす（「止まった機体は動き出さない」の例外）。緩和を始めた後は、緩和しなかったとき
      # （始めた位置に止まっていたとき）に当たるかで続けるかを決める。走っている間は、局所計画の停止線と上の
      # oncoming の減速で応じる。crowd_stats の head_on.yaml（192 回）で、当たるときの速さの平均 1.92→1.41m/s、
      # 1.5m/s 以上で当たる接触 6.69→3.51 回/100秒、自機が原因の接触 0→0。横へ動く候補や、走りながらの緩和では、
      # 当たり方の予測がずれて自機が原因の接触が出た（0.24〜3.45 回/100秒）。enabled: false で元の動き
      mitigation:
        enabled: true
        min_impact_speed_mps: 1.5
        horizon_s: 1.0
        max_shift_m: 0.5
        max_speed_mps: 1.5
        min_reduction_mps: 0.3
        directions: 16
      # 見えない側（機体の後ろ）へ向かう退避の候補の速さの上限は、局所計画と同じ値を mppi.yaml の
      # heading.blind_side（enabled、visible_half_angle_deg 96°、speed_mps 0.5m/s）から読む（設定ファイルは
      # 全ノードで共通）。到達範囲のために指令を替えるとき、候補の速度の向きが機体の前から 96° より外なら
      # 0.5m/s までに縮めてから確かめる。指令をそのまま通すときと、衝突までの時間で減速するときはかけない
      # （MPPI の指令にはかかっている）
