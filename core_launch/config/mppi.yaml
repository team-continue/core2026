# 局所計画 MPPI-lite の設定。値はすべて暫定で、シミュレーションと実機で調整する。
/**:
  ros__parameters:
    # 柵と静止物の距離の場の格子 [m]。距離はセルごとに一定なので、格子の大きさの段ができる。0.1m では、
    # 幅 2.0m（距離の場）のすき間で、柵の罰の外側の境（0.1 + 0.5 + 0.1 秒 × 速さ）と段が重なって
    # ブレーキの系列が最も安くなり、止まった（gap_test 6 回で行き詰まり 11 回、うちすき間 9 回、走行 平均
    # 60.8 秒）。
    # 0.05m で止まり 0 回、走行 42.1 秒（3 回）、静止物まで 0.55m 以上、obstacle_goals でも止まり 0 回。
    # 距離の場を作る時間は地図の読み込みが大半で 0.1m と同じ（約 7〜8ms、482x302）、1 周期の計算時間も
    # 変わらない（相手 11 台で中央 0.86ms）。メモリは 0.15→0.58MB
    grid_resolution_m: 0.05
    mppi:
      samples: 300
      horizon_steps: 20
      dt: 0.1
      # 大きいと左右に割れた候補を平均してしまい、混雑で進めなくなる
      temperature: 1.0
      noise_linear: 0.8
      noise_correlation: 0.7
      # 5m/s で走らせるときは、static_margin_time_s を 0.08 以下にする（下の static_margin_time_s の制約。
      # 0.1 秒のままでは mppi_lite が起動しない・値を受け付けない）
      max_speed_mps: 3.0
      # 機体の加速度の上限（シミュレーションは 5m/s2）より小さくして、計画と実際のずれを減らす。
      # 床が滑ると機体が出せる加速度は下がる。計画が床の出せる加速度を超えると、止まりきれずに静止物や
      # 曲がりの外へ出る。tracking_bench（滑り「強」: 床が出せる加速度 3.0、滑ると 2.0m/s2）で、元の設定
      # （3.0、reference_decel_mps2 2.0、曲がりの上限なし、planner の extra_clearance_m 0.3）は静止物に
      # 触れた（5m/s の obstacle_goals 16 回で 4 回）。今の組み合わせで 0 回。滑らない床では周回が延びる
      # （下の curve を参照）
      # core2026 の足回り（body_control_node の acceleration 2.0m/s²、rotation_acceleration 1.0rad/s²）に
      # 合わせる（lidar_nav では 2.5m/s²・6.0rad/s²）。足回りが計画より遅く加速すると、予測とずれる
      max_accel_mps2: 2.0
      max_angular_speed_radps: 1.5
      max_angular_accel_radps2: 1.0
      # 向きの目標（heading.mode で決める）へ回る速さの、向きの誤差に対する比。向きはサンプルせず、この比で決める
      yaw_gain_per_s: 1.5
      # 参照軌道の減速度。max_accel_mps2 と同じ理由で、滑る床でも止まれる値にする（2.0→1.8）
      reference_decel_mps2: 1.8
      # 経路の曲がりで、参照軌道の速さを横の加速度の上限まで落とす（曲率 κ で √(上限 / κ)、手前から
      # reference_decel_mps2 で落とす）。参照軌道は曲がりでも上限の速さのまま進み、追いつけない機体が
      # 曲がりの外へ膨らんでいた。全方位移動でも、速度の向きを変える加速度（v² × κ）は要る。
      # tracking_bench（obstacle_goals と obstacle_goals_far、3・5m/s、滑りなし〜強、各 16 回）で、
      # planner の extra_clearance_m 0.6 と max_accel_mps2 2.5 と合わせて、滑りなし〜強の 12 条件で、曲がりの外
      # へのはみ出しの 95% 点 0.32〜0.44→0.08〜0.24m、静止物の接触 15→1 回（12 条件の合計）。
      # 滑らない床の周回は 3〜8 秒延びる（3m/s で 35.2→39.6 秒）。max_lateral_accel_mps2: 0 で元の動き
      curve:
        max_lateral_accel_mps2: 2.0
        # 曲率を測る前後の距離。経路の点は 0.1m おき
        window_m: 0.5
      goal_tolerance_m: 0.15
      goal_speed_tolerance_mps: 0.2
      latency_compensation_s: 0.05
      # 機体の駆動の遅れ（床によらない機体の値）。実機は、滑らない床で止まった状態から段差の指令（例: 1m/s）
      # を出し、/cmd_vel を出した時刻と車輪・LIO の速度から測る。シミュレーションは sim.launch.py の
      # drive_dead_time（無駄時間）と slip_time_constant（時定数）に合わせる
      drive:
        # true なら、送った指令（/cmd_vel）で、今送る指令が効き始める時刻（今 + 計算の時間 + dead_time_s）
        # まで状態を進めてから計画する。false なら前の動き（latency_compensation_s の間、今の速度で位置を進める）。
        # tracking_bench（2 コース × 3・5m/s × 滑りなし・強、各 8 回、時定数 0.05 秒）で、無駄時間 0.02/0.05/
        # 0.08/0.12 秒の静止物の接触は、前の動き 0/9/39/138 回、true（lag_in_rollout も true）で 0/0/0/0 回。
        # 周回は前の動き 49/52/68/79 秒、true で 46 秒前後。見込みの無駄時間が ±0.03 秒ずれても接触 0、見込みを 0
        # にすると前の動きと同じく当たる。Gazebo（無駄時間 0.08 秒・時定数 0.05 秒、5m/s）では静止物の接触 4→0 回、
        # 周回 107.6→53.5 秒（遠いゴール）。
        # 強く滑る床では、滑っている時間が増える（19→30〜49%）。指令は 0.1 秒ごとの段差なので、段差の直後に
        # 駆動が床の限界を超える加速度を出す（前の動きは古い速度を基準にしていたので段差が小さかった）。
        # 駆動の加速度の上限が床の静止摩擦以下なら 2〜4%。
        # 遅れのない機体（無駄時間 0.02 秒・時定数 0）では、前の動きの方がはみ出しが少し小さい（95% 点
        # 0.10 と 0.14m）。既定は false のまま。実機の遅れを測ってから true にする
        predict_delay: false
        dead_time_s: 0.0
        time_constant_s: 0.0
        # 駆動の加速度の上限（先を読むときに使う）。足回りの body_control_node と、シミュレーションの
        # omni_force_drive と同じ値
        max_accel_mps2: 2.0
        max_angular_accel_radps2: 1.0
        # 予測にも time_constant_s の一次遅れを入れる
        lag_in_rollout: true
      # 到達後や行き詰まりの間（待つ・下がる）も、向かってくる相手を避けるか。止まっている自機に
      # 当たるのは相手の責任とし、避けない。true で元の動き（相手すべてを避ける）
      evade_while_stopped: false
      # 同じ間に、向かってくる人だけは避けるか。2026-11-13 のユーザーの判断で、止まっているときは人が
      # 来ても動き出さない（false）。true で前の既定（人だけ避ける）。下がっている途中なら下がり切る。
      # 安全停止（safety_gate）も止まった機体を動かさないので、止まっている間は人にもロボットにも動かない
      evade_humans_while_stopped: false
      # 自機が近づく向きに動いていない、動いているロボット（後ろから追いつかれる、横から当たってくる）も
      # 避けるか。false なら、自機の速度の相手の方向の成分が正のステップだけ、重なり・接近・衝突コースの
      # コストを数える（run_scenario.py の classify_contact と同じ境界）。人、止まっている相手（0.3m/s
      # 未満）、分類できない相手、合流で先に入る相手、横切りの相手は、この値によらず避ける。true で元の
      # 動き。crowd_stats（crowd_goals 240 回）で接触は元の動きの 0.27 回/100秒から、既定で 3.47 回/100秒
      # に増え、増えた分はほぼすべて相手から当たったもの（自機が原因は 0.00→0.04 回/100秒）。
      # 周回は 70.7→66.2 秒
      avoid_being_hit: false
      tracks_max_age_s: 1.0
      # 姿勢と同じスキャンの追跡結果を待つ上限 [s]。検出も同じ /lio/odom を受けてから約 1ms 後に追跡結果を
      # 出すので、待たないといつも 1 つ前のスキャン（約 100ms 前）の追跡結果を使う。0 なら待たない
      tracks_wait_s: 0.02
      backoff_speed_mps: 0.5
      keep_out_range_m: 0.5
      # 静止物との余裕（footprint.margin_m の 0.1m）に足す「速さ × この時間」。計画から機体が動くまでの
      # 遅れの間に進む分。速さの上限（max_speed_mps 3m/s と、回転 1.5rad/s で機体の角が動く 0.85m/s の和）
      # との積が、機体の 4 隅を調べる範囲に足す距離（コードの kKeepOutCheckMarginM、0.5m）未満の値だけを
      # 受け付ける（今の設定では 0.129 秒以下）。0.1 秒は元の定数と同じ値
      static_margin_time_s: 0.1
      # 上の速さを、静止物へ近づく向きの速さだけにする。機体の 4 隅と中心のうち静止物に最も近い点の速度
      # （回転の分を含む）と、その点の距離の場の勾配（中心差分）の内積から求める。勾配が求まらない所
      # （占有の中、通路の真ん中の尾根など）では全方向の速さを使う。全方向の速さでは、壁と平行に走っても
      # 速いほど罰が増え、両側に壁がある狭い所で過度に減速した。閉ループの試験（指令どおりに動く機体、
      # 3 回の平均、壁なしで 2.87m/s）で、長さ 10m の通路は幅 1.8m と 2.0m で入口の手前で止まる→3.00m/s、
      # 幅 2.4m で 2.33→2.90m/s。長さ 1m のすき間は幅 2.0m で 0.56→2.94m/s。柵と平行に走るときの柵までの
      # 余裕は約 0.88→0.57m。壁へ向かうときは近づく速さが全方向の速さと同じなので、止まる位置は変わらない。
      # 幅 1.6m 以下の長い通路は今までどおり通れない。長さ 1m・幅 1.6m（片側 0.4m）のすき間は、元の動きでは
      # 通れなかったが、10 回中 7 回通れた（壁まで最小 0.40m）。false で元の動き（全方向の速さ）。
      # 既定は false（ユーザーの判断）。Gazebo の obstacle_goals（3 周）で、true では相手を避けるときに箱へ
      # 1.5〜2.5m/s で向かって止まりきれず、安全停止の静止物の判定（safety_stop.static）と合わせても 6 回中
      # 1 回で 2 接触、true だけでは 3 回とも箱に触れた。速いほど余裕を広げる全方向の速さのほうが、急に
      # 避けたときの余裕が残る。false と安全停止の判定では、静止物まで 0.37〜0.43m で接触 0（3 回）
      static_margin_approach_only: false
      weight_tracking: 1.0
      weight_terminal: 5.0
      # 相手との間で挟まれたときに柵へ寄らないよう、相手の余裕（weight_object）より大きくする
      weight_keep_out: 200.0
      weight_collision: 1000.0
      weight_object: 50.0
      weight_effort: 0.1
      # 動いている相手に向かう速度の重み。早めに横へ避けるようになる
      weight_collision_course: 10.0
      collision_course_lookahead_s: 2.5
      # 相手の大きさと安全距離。人には大きめの安全距離を取る
      # 相手の向きは分からないので、0.8m 角の箱の外接円に近い大きさにする
      robot_radius_m: 0.55
      human_radius_m: 0.3
      unknown_radius_m: 0.5
      # ロボットとの間は目安 0.5m、最小 0.2m（2026-11-14 のユーザーの判断）。どちらも機体の余裕
      # （footprint.margin_m の 0.1m）込みで、相手は向きが分からないので外接円（robot_radius_m）で数える
      # ので、設定の値は 0.1m を引いた 0.4m と 0.1m。目安の内側は weight_object の罰で、通路が狭くて開け
      # られなければ内側を通り、speed_limit の決まりで減速する。最小の内側は weight_collision まで上がる罰。
      # 間 1m（余裕 1.0m）では、ゴールが埋まったときの代わりの地点（相手から 2.0m）へ着けなかった
      robot_margin_m: 0.4
      robot_min_margin_m: 0.1
      # 人の中心から機体の外形まで 1.1m（人は 1m 以上よける。2026-11-14 のユーザーの判断）
      human_margin_m: 0.8
      unknown_margin_m: 0.6
      prediction_sigma_growth_mps: 0.3
      # 追跡の速度の不確かさ（velocity_sigma。追跡を始めた直後や長く隠れた後だけ正）に掛けて、予測の
      # 広がりに足す倍率。上の広がりは相手の速さで弱めていて、止まって見える相手にはほぼ効かないので、
      # 速度がまだ定まっていない間は別に足す。0 で元の動き
      prediction_velocity_sigma_gain: 1.0
      object_discount: 0.95
      # 相手のロボットの速さの上限。合流の規則とゴールの手前で待つ判定で、相手が
      # safety_stop.reachable.obstacle_accel_mps2（safety_stop.yaml、1.5m/s²。安全停止と同じ値を共有する）
      # で速くなる上限に使う。相手も自機と同じ機体（最高 3m/s）とする
      object_max_speed_mps: 3.0
    # 合流の規則。進む向きの差が 90° 未満で、互いに近づいている、動いているロボットに当てる（人には
    # 当てない）。進路が 15° 未満で交わる相手は、同じ線の上の追従・追い越しとして扱う。
    # 自機が先に進路の交点を通れる相手には減速しない（予測の広がりと衝突コースの罰を使わない）。
    # 代わりに、2 台の中心を結ぶ線の垂直二等分線を自機の機体（footprint の余裕 0.1m を含む）が越える
    # ときだけ罰を与える。相手が先なら、相手が後ろや横にいても今までどおり避けて後ろにつく。
    # 交点は前回の MPPI の軌跡（実際に進む線）で取る（軌跡で届かなければ経路で取り、自機が着くのは
    # 軌跡の終わりの 2 秒より後とする）。相手が交点に着く時刻は、相手が 1.5m/s²（安全停止の
    # obstacle_accel_mps2）で mppi.object_max_speed_mps まで速くなるとして早めに見積もる。
    # 先に入ると判定していても、今の速度のままでは機体どうしが重なる（余裕を除いた大きさで当たる）系列
    # には、衝突コースの罰を数える。
    # 譲る相手（合流で相手が先、横切り）との重なりと接近は、等速の予測の位置から、同じ加速度で速くなった
    # ときの位置までの線分で見る（等速の予測のままでは、相手が先と判定しても譲る系列にならなかった）。
    # 記録の自機が原因の接触（c1）は、加速中の相手の追跡の速さ（遅れて 0.46m/s。真は 1.0m/s）と、
    # 経路の上の交点（実際の機体は経路から 1.3m 離れていた）で、自機が先と判定していた。
    # 直した後の再生では、接触の 1.5 秒前に相手が先（自機の先行 0.47 秒）と判定し、計画と相手の真の
    # 将来位置の中心距離（1.5〜0.5 秒前の平均）は 0.21→1.78m。一方、等速 2.5m/s の相手より 0.7 秒先に
    # 着ける形でも、相手が速くなれば 0.3 秒差になるので、離れている間は先に入ると判定しない（近づくと
    # 変わる）。crowd_stats（240 回）で、相手が速くならない見積もり（mppi.object_max_speed_mps 0.1）に
    # すると、接触は crowd_goals 3.79→5.12、crossing.yaml 0.27→1.35 回/100秒に増える。
    # enabled: false で元の動き。crowd_stats で無効にすると 3.47→3.84 回/100秒（直す前）
    # 機体の向きの決め方。LiDAR（Mid-360）は機体の前の端（x=0.44m、床から 0.25m）にあり、後ろ側の 168° は
    # 機体にさえぎられて見えない（見えるのは前 ±96°）。ゴールの向きを保って走ると、走る時間の約半分は
    # 見えない側へ動いていた。Gazebo の crowd_goals（6 回）で自機が原因の接触が 50 回（0.85m の取り付けでは
    # 0 回）で、そのうち 47 回は相手が後ろか横後ろにいた。走っている間は進む向きへ回して、見える側へ進む。
    # 向きはサンプルせず、決めた目標へ mppi.yaw_gain_per_s の比例で、max_angular_speed_radps（1.5rad/s）と
    # max_angular_accel_radps2（6rad/s²）の中で回る。すべての系列で同じ向きを予測するので、回るときの機体の
    # 角の動きは静止物と相手のコストに入る。
    # Gazebo の crowd_goals（進む向きと向きを保つ動きを 6 回ずつ、同じ時間帯に交互に走らせた）で、自機が原因の
    # 接触は 5.02→0.36 回/100秒（56→5 回。向きを保つと 54 回は相手が横後か後ろ）、接触の合計は 9.06→6.47 回/100秒、
    # 見えない側へ進んだ時間は 45→8%。一方、止まっている・遅い自機に相手から当たる接触は 4.03→6.11 回/100秒に
    # 増え、走行は 186→232 秒に延びた（ゴールごとに、走り出しで 1.5m/s になるまで 0.93→1.44 秒、最後の 1m が
    # 1.40→1.75 秒）。check_features は 70/70（向きを保つと speed_limit、footprint、goal_handling が後ろ向きの区間で
    # 不合格）。統計モデル（crowd_stats、機体の陰 model.visible_half_angle_deg=96）では、自機が原因
    # 4.34→0.24 回/100秒、接触 8.67→5.12 回/100秒、周回 64.4→70.8 秒
    heading:
      # travel: 走っている間は、参照の経路の今の位置から lookahead_m 先までの向きへ回る。ゴールまでの残りが
      #   goal_align_distance_m 以下になったら、ゴールの向き（指定があるとき。なければ今の向きを保つ）へ回る。
      #   ゴールの手前で待つ（goal_approach）間は、待つ位置でも進む向きを保つ（残りは切る前の経路で数える）。
      #   経路から横へ外れて避けている間も経路の向きを使うので、横へ避ける動き（±90°）では回らない。
      # goal: ゴールの向きへ回り、なければ今の向きを保つ（前の動き）。blind_side.enabled: false と合わせると
      #   変更前と同じ動きになる
      mode: travel
      # 進む向きを取る距離 [m]。経路の今の位置からこの距離先までの弦の向きにする。曲がり角の約 1m 手前から
      # 回り始め、経路の点の細かいぶれでは向きが揺れない
      lookahead_m: 1.0
      # ゴールの向きへ切り替える、経路に沿ったゴールまでの残り [m]。参照の減速（2m/s²）では残り 1m の速さは
      # 約 2m/s で、着くまで約 1 秒。ゴールの向きが進む向きと大きく違うと回り終わる前に着く（到達は位置と
      # 速さだけで判定し、着いた後は回らない）
      goal_align_distance_m: 1.0
      # 見えない側へ進むときの速さの上限。進む向きが機体の前から visible_half_angle_deg より外なら、MPPI の
      # 各系列の各ステップ（そのステップで予測した機体の向きで判定）、参照軌道、行き詰まりの後退の速さを
      # speed_mps までに抑える。横へ避ける動き（±90°）は見える範囲なので抑えない。安全停止（safety_gate）も
      # 同じ値を読み、到達範囲のために指令を替える候補にかける。enabled: false で上限をかけない
      blind_side:
        enabled: true
        # 見える範囲の半角 [deg]。機体の前の端（中心から 0.44m）の LiDAR から、機体の前の面の両端の角
        # （中心から前 0.4m、左右 0.4m）を見る角度 atan2(0.4, -0.04) ≈ 96°。これより後ろは機体の陰になる
        visible_half_angle_deg: 96.0
        # 0.5m/s は、反応 0.2 秒と 3m/s² の減速で約 0.14m で止まれる速さ。行き詰まりの後退
        # （mppi.backoff_speed_mps 0.5）と同じなので、後退は今までどおりの速さで下がる。速度の上限の下限
        # （speed_limit.min_speed_mps 0.5）とも同じ。MPPI は上限で縮めた系列の重み付き平均を使うので、見えない側
        # へは約 0.4m/s で進む
        speed_mps: 0.5
    merge_rule:
      enabled: true
      # 交点を通る時刻（中心）が、相手よりこれだけ早ければ自機が先。承認された仕様の値。
      # crowd_stats で 1.0 秒にすると 3.30 回/100秒で、差はばらつきの範囲（±0.3）
      lead_time_s: 0.5
    # 横切りの規則。合流（向きの差 90° 未満）でも正面（150° 以上）でもなく、自機の進路の前方で進路が
    # 交わる、動いているロボットには、近づく向きの判定を当てずに今までどおり避ける（承認された表の
    # 「前を横切る相手: 変えない」）。自機が相手の前を横切る形で、相手が横から来ても譲る。自機が交点を
    # すでに通り過ぎていれば当てない（後ろや横から当たってくる形は避けない）。
    # 正面の境 150° は、30° より浅く交わる進路では交点が遠く、追跡の向きのぶれで大きく動くため。
    # enabled: false で、横切りの相手にも近づく向きの判定を当てる（前の版の動き）。
    # crowd_stats で、crowd_goals は 4.64→3.47 回/100秒、crossing.yaml は 1.92→0.63 回/100秒
    # （元の動きはそれぞれ 0.27、0.04）。残りは、自機が交点を通り過ぎた後に横から当たるものと、
    # ほぼ直角の横切りが追跡のぶれで 90° 未満（合流）と判定されたもの
    crossing_rule:
      enabled: true
    # 正面から来るロボットと、合流・横切りのロボットへの応じ方（2026-11-14 のユーザーの判断）。予測の位置を
    # よけて横へ道を開けることはせず、経路の上で止まって応じる。動いているロボット（track_motion で動いて
    # いるとみなしたもの）だけに当てる。人は今までどおり避ける。
    # - 正面（進む向きの差 150° 以上）で、自機に着くまでに通り道（自機の半幅と余裕と相手の大きさ）に入る
    #   相手: 出会う所がゴールから pass_goal_margin_m 以上手前なら、止まらずにすれ違いの規則（passing_rule）の側へ
    #   よけて通る。ゴールの近くで出会うなら、出会ったときの 2 台の中点より、自機の前の端（余裕を含む）が
    #   stop_before_midpoint_m 手前で止まる。
    #   さらに、相手がそのまま来ても届く前に止まり終える速さ（参照軌道の減速度で）までに抑える。中点だけ
    #   だと、3m/s どうしで相手が止まらないとき、自機が約 1.0m/s で動いているうちに当たり、自機が原因になる
    # - 合流・横切りで相手が先に交点を通る（merge_rule.lead_time_s で判定）: 交点の手前で止まって先に通す
    # - 合流・横切りで自機が先: 進路を保つ（当てられても相手の責任）
    # 止まる理由がなくなっても resume_after_s は停止線を保つ。止まった相手は、止まっている相手として
    # すれ違いの規則（passing_rule）の側から回り込む。規則を当てるのは経路をふさいでいる（通り道の上にいる）
    # 止まっているロボットだけで、ゴールが相手の 1m 先より近ければ当てない（経路の横にいるだけの相手に当てると、
    # 規則と逆の側にいるとき罰のかからない所まで経路から大きく外れた）。
    # enabled: false で元の動き（すれ違いの規則は向かってくる相手に当てる）
    oncoming_rule:
      enabled: true
      stop_before_midpoint_m: 0.3
      resume_after_s: 0.5
      range_m: 15.0
      # 正面で通り道に入る相手と出会う所（出会ったときの 2 台の中点）から、経路に沿ってゴールまでがこれ以上なら、
      # 止まらずにすれ違いの規則の側へよけて通る（2026-11-14 のユーザーの判断。ゴールの近くでは止まる）。
      # 負なら常に停止線で止まる。crowd_stats の head_on.yaml で、止まると周回 21.0→23.9 秒、相手から当たる
      # 接触 3.8→8.6 回/100秒（1.5m/s 以上 0.56→3.96）、自機が原因 0.04→0.00 回/100秒だった
      pass_goal_margin_m: 3.0
    # 追跡の速度を、安全停止（safety_gate）の動いている相手の判定（正面の相手への減速、衝撃の緩和）に使ってよいか。
    # 速さが min_speed_mps 以上で、速度の不確かさが max_velocity_sigma_mps 以下で、見えている（予測だけで
    # 続けていない）状態が persist_s 続いた追跡だけを、動いているとみなす。かけるのはロボットの追跡だけ。
    # 局所計画（mppi_lite）は追跡の速度をそのまま使い、この判定を使わない。局所計画で速度を 0 にすると、追跡を
    # 始めた直後や見えなくなった間の、本当に速く動いているロボットの動きを見込めず、Gazebo の crowd_goals で
    # 横切る相手に当て（自機が原因、当たる速さ 3.5m/s）、見え直した相手を急によけて柵に触れた。人にかけると、
    # 折り返して歩き出した人を止まっているとみなして当てた。止まっているロボットに付く誤った速度で横へ大きく
    # 外れるのは、上の oncoming_rule（予測の位置をよけない）で防ぐ。speed_limit の試験（2026-11-14、99b29c3）で、止まっているロボットの追跡に、始めた
    # 直後や見えなくなった後に経路へ向かう 0.4〜2.3m/s の速度が付き、局所計画がそれをよけて経路から外れた。
    # enabled: false で元の動き（速さだけで決める）
    track_motion:
      enabled: true
      min_speed_mps: 0.3
      max_velocity_sigma_mps: 0.2
      persist_s: 0.5
    # ゴールの手前で待つ。動いているロボットが、自機が着くまでの間にゴールの近くを通る予測なら、経路を
    # ゴールの手前 hold_distance_m で切って、MPPI の参照軌道をそこで止める。相手は今の向きの直線の上を
    # 1.5m/s²（安全停止の obstacle_accel_mps2）で速く（3m/s まで）も遅く（折り返しも）もなりうるとし、
    # 自機が待つ位置を越えてからゴールに着くまでの間に、中心が radius_m 以内を通りうるかを見る。
    # 待つ位置も相手の通り道の上（機体の外接円 + 余裕 + 相手の半径以内）なら、待っても離れられないので
    # 理由にしない（同じ線を進んでくる相手は MPPI が避ける）。待つ位置より内側に入っていれば待たない。
    # 止まって着いた後に来るロボットは避けない方針は変えない（着くまでの間だけを見る）。
    # 記録の自機が原因の接触で、ゴール (8, ±5) は robot_9 の通り道の上、(-8, -5) は robot_1 の通り道
    # から 1.0m で、自機は 1.7〜2.8m/s で向かっていた。参照の減速（2m/s²）は残り約 2m からなので、
    # 速さを上限で抑えるのではなく、参照軌道の終わりを手前にする（速度の上限を下げると避ける速さも
    # なくなる。大域計画のゴールの処理は 2Hz で、止まっている相手に塞がれたゴールを扱う）。
    # 記録の再生（run2、v2new2、new6）で、計画と相手の真の将来位置の中心距離（接触の 2〜1 秒前の平均）は
    # 0.62→2.38m、0.61→2.17m、0.98→2.56m。統計モデル（crowd_stats、240 回）では待つ分だけ周回が延び、
    # crowd_goals では待つ間に当てられる接触が増えた（相手の責任。接触 3.24→3.99 回/100秒、周回 69.4→74.9 秒）。
    # lane_goals では接触 1.90→1.54 回/100秒、周回 32.8→36.5 秒。enabled: false で元の動き
    goal_approach:
      enabled: true
      # 相手の中心とゴールの距離。機体 0.4m + 相手 0.4m の半分の幅に、0.7m の余裕を足した程度
      radius_m: 1.5
      # 待つ位置。2.9m/s から 3m/s² で止まれる 1.4m に余裕を足した距離。相手の通り道に直角に
      # 近づくとき、待つ位置は通り道から 2.0m で、上の通り道の判定（1.34m）より外になる
      hold_distance_m: 2.0
      # 1 つのゴールで、待つ位置の近く（経路に沿って 0.5m 以内）で待つ時間の上限。過ぎたら待たずに進む。
      # 相手が往復し続けて着けなくなるのを防ぐ。端で折り返す相手が、ゴール (8, -5) の先（端まで 2m）に
      # いる時間は約 3.6 秒。待つと決めた時刻から数えると、遠くから待ち始めたときに着く前に上限に達し、
      # 相手が通る最中にゴールへ入った（Gazebo の crowd_goals で自機が原因の接触 1 回）ので、待つ位置の
      # 近くにいる間だけ数える
      max_hold_s: 6.0
      # 待っている間に通る予測がなくなっても待ち続ける時間。端で折り返す相手は、向きを変える間（追跡で
      # 約 0.5〜1 秒）速度が小さく向きも定まらず、予測が途切れる（記録の再生で、待つ・待たないが
      # 周期ごとに入れ替わった）。待つ位置が相手の通り道の上かは、待ち始めるときだけ調べる
      release_s: 1.0
    # 床の滑りの推定。送った指令（/cmd_vel）と測った速度から、床が出せる水平の加速度（静止摩擦）を
    # update_period_s ごとに推定し、計画の加速度・参照軌道の減速度・曲がりの横の加速度の上限を、床の値に
    # accel_ratio・decel_ratio・lateral_ratio を掛けた値にする（min_*〜max_* に収める）。床 3.0m/s2 で今の
    # 既定（2.5、1.8、2.0）、滑らない床で max_*（加減速度は見直しの前の 3.0、2.0、曲がりは 2.5）。下げるのはすぐ、
    # 上げるのは raise_after 回続いてから。駆動の遅れは mppi.drive.dead_time_s と time_constant_s を使う
    # （遅れを入れないと、遅れの分を滑りと取り違える）。推定は /navigation/traction に出す。
    # enabled: false なら上の mppi の固定の値（元の動き）
    traction:
      enabled: false
      update_period_s: 2.0
      window_s: 3.0
      horizon_s: 0.3
      min_excitation_mps: 0.3
      # 上限なしより誤差がこの比以下、かつこの差以上小さければ滑りとみなす。LIO の速度のばらつきで誤差の底が
      # 約 0.1m/s あり、Gazebo の氷でも滑りの分は 5〜10% しか減らない（0.9・0.02 では氷の窓の 1 割しか見なかった）
      min_improvement_ratio: 0.95
      min_improvement_mps: 0.005
      raise_after: 2
      # 推定を始める前の床。氷くらい（2.0）から始め、滑りが見えなければ 1 段ずつ上げる
      initial_friction_mps2: 2.0
      accel_ratio: 0.8333
      decel_ratio: 0.6
      lateral_ratio: 0.6667
      max_accel_mps2: 3.0
      max_decel_mps2: 2.0
      # 3.0 では、Gazebo の 5m/s で 2m/s 以上のはみ出しの 95% 点が 0.15→0.53m に増えた（2.5 で 0.23〜0.25m）
      max_lateral_accel_mps2: 2.5
      min_accel_mps2: 1.0
      min_decel_mps2: 0.8
      min_lateral_accel_mps2: 1.0
