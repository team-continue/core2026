# 点群抽出（地図照合の入力 scan_filter から、照合に使う点だけを取り出す。core_localization の
# point_extraction.hpp）。launch の point_extraction でモードを選ぶ（off / ceiling / field_objects）。
# ノードの既定は off で、このファイルは point_extraction を off 以外にしたときだけ読む。FAST-LIO の手前にはかけない。
# どのモードも、scan_filter のボクセルとランダムサンプルの前にかける。
# - ceiling（天井）: 床と、床から band_max_m より上だけを残す。人の帯と観客席の箱の中を除く。箱は
#   exclude_regions.yaml に書き、launch が point_extraction.ceiling.region.* に直す。柵の外（outside）では
#   人の帯の上限を広げる。範囲はフィールドの範囲（field.yaml。launch が一緒に渡す）から決める
# - field_objects（フィールドオブジェクト）: フィールドの範囲（field.yaml。launch が一緒に渡す）に
#   field_margin_m を足した範囲（map）の、床から max_height_m までだけを残す。外（観客）と上（屋根）を除き、
#   フィールドの中の相手は追跡（/perception/tracks）の柱で除く
# 残る点が min_points より少ない周期は、その周期は抽出をかけずに全点を通して警告する。
/**:
  ros__parameters:
    point_extraction:
      # odom は起動時の base_link（床に投影した機体中心）なので、z=0 が床になる
      floor_frame: odom
      floor_z_m: 0.0
      map_frame: map
      ceiling:
        # 0.1m 未満は床として残す。上限は人の背丈（約 1.9m まで）に、手を上げた分などの余裕を足した値
        band_min_m: 0.1
        band_max_m: 2.2
        # 柵の外（観客がいる所）の人の帯。実機の会場の観客席は測らずに決めた仮の値（決め打ち）。
        # - field_margin_m: フィールドの範囲（柵の内側の面）からこれより外を、観客がいる所とみなす。柵のすぐ外は
        #   人が床に立つので、ふつうの帯（2.2m まで）で除ける
        # - band_max_m: 床から band_min_m〜これを除く。台や段になった観客席の低い段（床から 0.8m まで）に立つ人の
        #   頭（2.2m）まで入るように 3.0m。これより高い段の人は exclude_regions.yaml の箱で除く
        # 柵の外の壁、観客席の前の面、柱などの、床から 2.2〜3.0m の部分も照合に使わなくなる
        outside:
          enabled: true
          field_margin_m: 1.0
          band_max_m: 3.0
        # 入力（FAST-LIO の歪み補正後の点群）は、今の取り付け（前の端の 0.25m、後ろ約 170 度は機体でさえぎられる）で
        # 1 周期 約 5300 点。その約 2 割（以前の人混みのフィルタと同じ割合）。シミュレーションの評価では、残る点は
        # 平均 約 4300〜4600 点、5% 点で約 3800 点、最少は約 1000〜1400 点（相手が目の前にいて視界がふさがった周期）で、
        # 下限を下回った周期はなかった。視界の大半がふさがったときだけ全点を通す
        min_points: 1000
      field_objects:
        # 柵の厚みと、すぐ外の動かない物を残す余裕
        field_margin_m: 0.5
        # ceiling の帯の上限と同じ。人の頭より上（屋根、壁の上の方）を除く
        max_height_m: 2.2
        # フィールドの中に動かない物が少ないと、残る点は床と柵（0.14m）と相手だけになる。シミュレーションの評価
        # （走行 190 秒）では、下限なしだと平均 約 500 点（入力 約 5300 点の 1 割）で照合が発散した（位置の誤差
        # 最大 15m、FAILED 58 秒）。下限 1500 点（約 3 割）では大半の周期は全点を通したが、まれに通った周期で
        # 誤差が跳ねた（位置の最大 45〜83cm、高さの最大 98〜115cm。静止物 8 個の field_obstacles.sdf でも同じ）。
        # 入力の約 5 割（フィールドの中の物が視界の半分ほどを占めるとき）にしても、近くの相手で点が増えた周期が
        # 通り、位置の最大 38〜81cm になった。下限では安全にできないので、動かない物の少ないフィールドでは使わない
        min_points: 2700
        tracks:
          enabled: true
          # 人はシミュレーションの円柱（半径 0.25m）、ロボットは 0.8m 角の外接円（0.566m）。種類が分からない物は
          # ロボットと同じにする
          human_radius_m: 0.25
          robot_radius_m: 0.57
          unknown_radius_m: 0.57
          # 追跡の位置の誤差（シミュレーションで約 0.13m）と、見えている面からの中心の推定のずれを含める
          margin_m: 0.2
          # 追跡の時刻と点群の時刻の差の上限。検出は 10Hz なので、5 周期分まで速度で進めて使う
          max_age_s: 0.5
