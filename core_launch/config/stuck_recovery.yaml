# 行き詰まりの検知と復帰（2026-11-16）。
# - 経路をふさがれた: 止まって、行き詰まった所を大域計画に知らせ（/planning/stuck_point）、そこを避けて計画し直した
#   経路を受けてから再び進む。max_retries 回で抜けられなければ FAILED で止まる（大域計画もゴールをやめる）
# - 到達が難しいゴール（固定物に近すぎて機体が入れない）: いちばん近くまで来て進めなければ、着いたことにする
/**:
  ros__parameters:
    stuck_recovery:
      enabled: true
      no_progress_timeout_s: 2.0
      min_progress_m: 0.2
      wait_s: 1.0
      # 待った後に下がる距離。0 なら下がらずに、計画し直した経路でそのまま進む（以前は 0.5）
      backoff_distance_m: 0.0
      # 計画し直して進むのを試す回数。これで抜けられなければ FAILED で止まり、新しいゴールを待つ
      max_retries: 3
      # ゴールまでの残りの最小値が、この時間 min_progress_m 以上よくならなければ、動き回っていても FAILED で
      # 止まる（0 で使わない）。見えていない通路も塞がれているとき（通れる 3 つの通路を止まったロボットで
      # 塞いだ試験）に、通路の間を動き回り続けないようにする
      give_up_s: 30.0
      # ゴールから固定物（地図・柵・入らない範囲）までの距離がこれより小さければ、到達が難しいゴールとみなす。
      # 機体の半幅 0.35m に、局所計画が固定物との間に取る余裕（構造物の 0.2m 手前のゴールで、機体はゴールの
      # 0.55m 手前、構造物から 0.4m 空けて止まった。2026-11-16 の Gazebo）を足した値
      hard_goal_clearance_m: 0.75
      # 到達が難しいゴールで行き詰まったとき、ゴールまでの残り（経路に沿った距離）がこれ以下なら着いたことにする
      # （0 で使わない）。大域計画がゴールを解除する距離（planner.yaml の reached_clear_radius_m 1.1）より内側にする
      near_goal_accept_m: 1.0
      # 行き詰まった後、計画し直した経路を待つ時間の上限。届かなければ今の経路のまま進む（0 で待たない）
      replan_timeout_s: 3.0
      # 行き詰まった所として大域計画に知らせる、経路に沿った機体の前方の距離（ゴールを越えない）
      blocked_ahead_m: 1.0
      # ゴールまでの残りの距離が減らなくても、前に進んだとみなした位置からこの距離以上動けば進んでいる
      # とみなす。残りの距離だけで測ると、すき間を行き過ぎて引き返すと残りが増え、0.6〜1.0m/s で
      # 動いていても行き詰まり（WAIT）になっていた（gap_test の記録）。0.5m は、no_progress_timeout_s
      # の 2 秒で平均 0.25m/s 以上動くこと。その場で揺れるだけ（±0.2m）なら数えない。0 で元の動き。
      # 記録の再生（第1段の後の obstacle_goals 3 回と、gap の base 3 回）で、前 2 秒の平均 0.4〜0.9m/s で
      # 動いていた WAIT 3 回がなくなり、すき間の前で 0.35m/s 以下でもたつく WAIT は残った（こちらは
      # mppi.yaml の grid_resolution_m 0.05 で止まらなくなる）
      moving_distance_m: 0.5
      # 動いていることで進んでいるとみなすのは、残りの距離が最後に減ってからこの時間まで。動き回るだけで
      # ゴールへ近づけないときは、この後 no_progress_timeout_s で行き詰まりとする
      moving_timeout_s: 10.0
