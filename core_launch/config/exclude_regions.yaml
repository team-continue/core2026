# 点群抽出の ceiling（天井）で、地図照合の入力から除く観客席の箱。人がいて動く場所を map の座標系の箱で書く。
# launch の point_extraction を ceiling にしたときに使う（抽出の値は point_extraction.yaml）。
#
# 書き方: 箱ごとに name と、x、y、z の [下限, 上限] [m]。箱は map の座標軸に沿う。
# - 床の上に立つ人は人の帯（床から 0.1〜2.2m）で除けるので、ここには書かない。
#   床から 2.2m より高い所にいる人（段になった観客席の上の段など）を囲む
# - z の下限は、人の足元（観客席の床や段）より 0.1m 上にする。観客席の前の面や段は動かないので、
#   地図照合の手がかりとして残す。段が何段もあるときは、段ごとに箱を分けるとよい
# - 地図照合の位置のずれの分、固定物のない側（空中）には余裕を持たせる
# - 壁や柱などの固定物にかからないようにする（かかった部分は照合に使えなくなる）
#
# 実機では観客席の位置に書き換える。値は今はシミュレーションのワールド（core_gazebo/worlds/field.sdf の
# stand_north: x -20〜10、y 14〜19、上面 z=5）に合わせたもの。北の壁（内側の面 y=19）を残すため、
# y の上限は 18.9 にする。観客席の前（y 13〜14）と両端（x -21〜-20、10〜11）の上は空中
regions:
  - name: stand_north
    x: [-21.0, 11.0]
    y: [13.0, 18.9]
    z: [5.1, 7.5]
