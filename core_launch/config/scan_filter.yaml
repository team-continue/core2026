# 地図照合の入力を減らす処理。every_n_frames、ボクセル、ランダムサンプルの順にかかる。
/**:
  ros__parameters:
    # 1 で毎周期（10Hz）。負荷が高ければ増やす
    every_n_frames: 1
    # 近距離の点が減る。1 周期 0.4ms ほどで、精度は変わらない（静止物だけと混雑の両方で確認）。
    # 機体の前の端の 0.25m の取り付けでも確かめた（NDT の格子 1.0m のとき）: 0.3m・0.2m（どちらも上限 6000 点）にしても、動く物なしの評価の経路で
    # 位置 RMSE 1.56・1.74cm（0.5m は 1.61cm）と変わらず、照合の CPU が 19→25% に増えるので 0.5m のまま
    voxel:
      enabled: true
      leaf_size_m: 0.5
    # 3000 点まで精度はほぼ変わらず、照合の負荷は半分以下になる。1500 点だと位置の最大誤差が 1cm 増える
    random:
      enabled: true
      target_points: 3000
