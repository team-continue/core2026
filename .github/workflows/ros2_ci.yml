name: build and test

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build_and_test:
    strategy:
      matrix:
        os:
          - ubuntu-22.04
        rosdistro:
          - humble

    runs-on: ${{ matrix.os }}

    container:
      image: ros:${{ matrix.rosdistro }}-ros-base

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup ROS2 workspace
        run: |
          mkdir -p /ros2_ws/src
          cp -r $GITHUB_WORKSPACE /ros2_ws/src/core2026
          find /ros2_ws/src -name '_codeql*' -exec rm -rf {} + 2>/dev/null || true
          # 自律移動が使う livox_ros_driver2 は、メッセージ定義だけのパッケージを置く（core_launch/scripts/setup_thirdparty.sh
          # と同じ）。core_launch の中にあると rosdep と colcon が探さないので、ワークスペースの別の場所へ写す
          mkdir -p /ros2_ws/src/thirdparty/livox_ros_driver2
          cp -r /ros2_ws/src/core2026/core_launch/thirdparty/livox_ros_driver2_msgs/. /ros2_ws/src/thirdparty/livox_ros_driver2/
          rm -f /ros2_ws/src/thirdparty/livox_ros_driver2/COLCON_IGNORE

      - name: Install dependencies
        run: |
          apt-get update &&
          rosdep update &&
          rosdep install --from-paths /ros2_ws/src -i -y --rosdistro ${{ matrix.rosdistro }} \
            --skip-keys "fast_lio lidar_localization_ros2"

      - name: Install diagnostic-updater
        run: apt-get install -y ros-${{ matrix.rosdistro }}-diagnostic-updater

      - name: Install ament-clang-format
        run: apt-get install -y ros-${{ matrix.rosdistro }}-ament-clang-format clang-format

      - name: Cache DepthAI SDK
        uses: actions/cache@v4
        with:
          path: /ros2_ws/src/core2026/core_enemy_detection/third_party/depthai_install
          key: depthai-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/core_enemy_detection/scripts/depthAI_install.sh') }}

      - name: Install DepthAI
        run: bash /ros2_ws/src/core2026/core_enemy_detection/scripts/depthAI_install.sh

      - name: Build tests
        run: |
          . /opt/ros/${{ matrix.rosdistro }}/setup.sh &&
          cd /ros2_ws &&
          colcon build

      - name: Run tests
        run: |
          . /opt/ros/${{ matrix.rosdistro }}/setup.sh &&
          cd /ros2_ws &&
          colcon test --packages-select \
            core_body_controller \
            core_damiao_imu \
            core_hardware \
            core_launch \
            core_localization \
            core_msgs \
            core_nav_common \
            core_path_follower \
            core_perception \
            core_planning \
            core_test \
            core_tools &&
          colcon test-result --verbose

      - name: Format with ament_clang_format
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          . /opt/ros/${{ matrix.rosdistro }}/setup.sh
          cd $GITHUB_WORKSPACE
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' || true)
          if [ -n "$files" ]; then
            ament_clang_format --reformat $files || true
          else
            echo "No C/C++ files to format."
          fi

      - name: Commit and push formatting changes
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          cd $GITHUB_WORKSPACE
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format with ament-clang-format"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No formatting changes to commit."
          fi
