name: Deploy docs (tag)

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'デプロイ対象のタグ名'
        required: true

permissions:
  contents: write

env:
  TARGET_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install -r requirements-docs.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1 || true

      # タグ名をそのままバージョン名としてデプロイする（既定バージョンは変更しない）
      - name: Deploy ${{ env.TARGET_TAG }}
        run: |
          mike deploy "$TARGET_TAG"
          git push origin gh-pages
